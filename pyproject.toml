[project]
name = "cisco-sdwan-mcp"
version = "0.1.0"
description = "MCP server for Cisco Catalyst SD-WAN Manager (vManage) — read-only fabric inventory, device health, BFD/OMP/control-connection state, alarms, tunnel quality, templates and policies for AI assistants."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = [
    "mcp",
    "mcp-server",
    "model-context-protocol",
    "cisco",
    "sdwan",
    "sd-wan",
    "catalyst-sdwan",
    "vmanage",
    "network-automation",
    "netops",
    "fastmcp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "fastmcp>=3.2.0",
    "markdown>=3.6",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/pcDamasceno/cisco-sdwan-mcp"
Repository = "https://github.com/pcDamasceno/cisco-sdwan-mcp"
Issues = "https://github.com/pcDamasceno/cisco-sdwan-mcp/issues"

[project.scripts]
cisco-sdwan-mcp = "cisco_sdwan_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cisco_sdwan_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
