{{- /*
Development-only fallback: rendered when `sdwan.password` is set and no
`sdwan.existingSecret` is named. The password then lives in the release's Helm
values in plain text. Prefer creating the Secret out-of-band.
*/ -}}
{{- if and .Values.sdwan.password (not .Values.sdwan.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cisco-sdwan-mcp.secretName" . }}
  labels:
    {{- include "cisco-sdwan-mcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  SDWAN_PASSWORD: {{ .Values.sdwan.password | quote }}
{{- end }}
