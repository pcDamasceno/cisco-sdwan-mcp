{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cisco-sdwan-mcp.serviceAccountName" . }}
  labels:
    {{- include "cisco-sdwan-mcp.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The server talks to vManage over HTTPS and never calls the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
