apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cisco-sdwan-mcp.fullname" . }}
  labels:
    {{- include "cisco-sdwan-mcp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "cisco-sdwan-mcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cisco-sdwan-mcp.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # Roll the pods when the rendered configuration changes — otherwise a
        # values-only edit updates the ConfigMap and nothing restarts.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "cisco-sdwan-mcp.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.mcp.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "cisco-sdwan-mcp.fullname" . }}-config
            {{- with (include "cisco-sdwan-mcp.secretName" .) }}
            # Supplies SDWAN_PASSWORD, and any MCP auth secrets stored
            # alongside it.
            - secretRef:
                name: {{ . }}
            {{- end }}
          {{- with .Values.extraEnv }}
          # `env` wins over `envFrom`, so these override the chart's ConfigMap.
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            {{- toYaml .Values.startupProbe | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          {{- if .Values.caBundle.existingConfigMap }}
          volumeMounts:
            - name: sdwan-ca
              mountPath: {{ .Values.caBundle.mountPath }}
              readOnly: true
          {{- end }}
      {{- if .Values.caBundle.existingConfigMap }}
      volumes:
        - name: sdwan-ca
          configMap:
            name: {{ .Values.caBundle.existingConfigMap }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
