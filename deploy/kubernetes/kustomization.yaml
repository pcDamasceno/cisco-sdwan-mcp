# Apply everything with:  kubectl apply -k deploy/kubernetes
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  # - secret.yaml   # copy secret.example.yaml → secret.yaml (git-ignored) first

# Set your image here instead of editing deployment.yaml:
images:
  - name: IMAGE
    newName: ghcr.io/OWNER/REPO
    newTag: latest
