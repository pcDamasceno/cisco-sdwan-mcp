# EXAMPLE ONLY — never commit real credentials.
#
# This Secret is REQUIRED: the server cannot reach vManage without
# SDWAN_PASSWORD. A pod referencing a missing Secret stays in
# CreateContainerConfigError rather than starting up half-configured, which is
# the intended failure mode.
#
# Preferred — create it out-of-band so credentials never touch the repository:
#
#   kubectl create secret generic mcp-server-secrets \
#     --from-literal=SDWAN_PASSWORD='...'
#
# Or use ExternalSecrets / SealedSecrets / a CSI secrets driver.
#
# Otherwise copy this file to secret.yaml (git-ignored), fill it in, and add
# "secret.yaml" to kustomization.yaml resources.
apiVersion: v1
kind: Secret
metadata:
  name: mcp-server-secrets
type: Opaque
stringData:
  # vManage password for the SDWAN_USERNAME set in the ConfigMap.
  SDWAN_PASSWORD: replace-me

  # For MCP_AUTH=github / google / azure / auth0 / workos / oauth-proxy / introspection:
  # MCP_AUTH_CLIENT_ID: replace-me
  # MCP_AUTH_CLIENT_SECRET: replace-me
  # For MCP_AUTH=static (development only):
  # MCP_AUTH_STATIC_TOKENS: dev-token-1,dev-token-2
